name: CI (Automated Test Suite)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Suite & Scenario Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r civis_bot/requirements.txt
          pip install pytest pyTelegramBotAPI python-dotenv

      - name: Run Pytest Test Suite
        env:
          BOT_TOKEN: "123456789:MOCK_TOKEN_FOR_CI"
          BOT_SHARED_SECRET: "ci_shared_secret"
        run: |
          pytest tests/ -v --tb=short
