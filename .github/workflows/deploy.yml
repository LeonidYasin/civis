name: Continuous Deployment (VPS Auto-Deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Civis Bot to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_PASSWORD,BOT_SHARED_SECRET
          script: |
            set -e
            echo "🚀 Starting automated Civis deployment on VPS..."

            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin

            # Determine deployment directory
            if [ -d "/home/l/civis" ]; then
              DEPLOY_DIR="/home/l/civis"
            elif [ -d "$HOME/civis" ]; then
              DEPLOY_DIR="$HOME/civis"
            elif [ -d "/opt/civis" ]; then
              DEPLOY_DIR="/opt/civis"
            else
              DEPLOY_DIR="/home/l/civis"
            fi
            echo "DEPLOY_DIR: $DEPLOY_DIR"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Backup critical local data before repository update
            if [ -f "civis_bot/.env" ]; then
              cp "civis_bot/.env" "civis_bot/.env.bak" 2>/dev/null || true
            fi
            if [ -f "civis_bot/civis_data.db" ]; then
              cp "civis_bot/civis_data.db" "civis_bot/civis_data.db.bak" 2>/dev/null || true
            fi

            # 1. Clone or update repository
            if [ ! -d ".git" ]; then
              echo "Initializing git tracking in existing $DEPLOY_DIR..."
              git init
              git remote add origin https://github.com/LeonidYasin/civis.git || git remote set-url origin https://github.com/LeonidYasin/civis.git
              git fetch origin main
              git reset origin/main
            else
              git remote set-url origin https://github.com/LeonidYasin/civis.git || true
              git fetch origin main
              git reset --hard origin/main
            fi

            # Restore local database if needed
            if [ ! -f "civis_bot/civis_data.db" ] && [ -f "civis_bot/civis_data.db.bak" ]; then
              cp "civis_bot/civis_data.db.bak" "civis_bot/civis_data.db"
            fi
            if [ ! -f "civis_bot/.env" ] && [ -f "civis_bot/.env.bak" ]; then
              cp "civis_bot/.env.bak" "civis_bot/.env"
            fi

            # 2. Configure Python environment
            cd "$DEPLOY_DIR/civis_bot"
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d "$HOME/venv" ]; then
              source "$HOME/venv/bin/activate"
            fi

            # Install or update requirements if pip is available
            if command -v pip3 >/dev/null 2>&1; then
              pip3 install -r requirements.txt || true
            fi

            # 3. Ensure MCP integration variables in .env
            if [ ! -f ".env" ]; then
              cp .env.example .env 2>/dev/null || touch .env
            fi

            # Inject BOT_SHARED_SECRET if passed from GitHub Secrets
            if [ -n "$BOT_SHARED_SECRET" ]; then
              if grep -q "BOT_SHARED_SECRET=" .env; then
                sed -i "s|^BOT_SHARED_SECRET=.*|BOT_SHARED_SECRET=\"$BOT_SHARED_SECRET\"|" .env
              else
                echo "BOT_SHARED_SECRET=\"$BOT_SHARED_SECRET\"" >> .env
              fi
            fi

            # Ensure local MCP endpoints are configured
            if ! grep -q "MCP_URL=" .env; then
              echo 'MCP_URL="http://127.0.0.1:3000/mcp"' >> .env
            fi
            if ! grep -q "MCP_REGISTER_URL=" .env; then
              echo 'MCP_REGISTER_URL="http://127.0.0.1:3000/api/bot/register-user"' >> .env
            fi

            # 4. Restart Civis Bot service
            echo "🔄 Restarting Civis bot process..."
            if systemctl is-active --quiet civis 2>/dev/null; then
              echo "Restarting via systemd service 'civis'..."
              sudo systemctl restart civis
            elif systemctl is-active --quiet civis-bot 2>/dev/null; then
              echo "Restarting via systemd service 'civis-bot'..."
              sudo systemctl restart civis-bot
            elif [ -f /etc/systemd/system/civis.service ]; then
              echo "Starting systemd service /etc/systemd/system/civis.service..."
              sudo systemctl daemon-reload
              sudo systemctl restart civis
            else
              echo "Restarting via background process..."
              pkill -f "python3.*bot\.py" || true
              sleep 2
              PYTHON_BIN="python3"
              if [ -x "$DEPLOY_DIR/civis_bot/venv/bin/python3" ]; then
                PYTHON_BIN="$DEPLOY_DIR/civis_bot/venv/bin/python3"
              elif [ -x "venv/bin/python3" ]; then
                PYTHON_BIN="venv/bin/python3"
              elif [ -x "$HOME/venv/bin/python3" ]; then
                PYTHON_BIN="$HOME/venv/bin/python3"
              fi
              nohup $PYTHON_BIN bot.py > bot.log 2>&1 &
            fi

            sleep 3

            echo "=== RUNTIME HEALTH CHECK ==="
            pgrep -fl "bot\.py" || systemctl status civis --no-pager || true

            echo "✅ Civis bot deployment completed successfully!"
