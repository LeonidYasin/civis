name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'civis_app/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Install dependencies
        working-directory: ./civis_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./civis_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: civis-app-android
          path: civis_app/build/app/outputs/flutter-apk/app-release.apk
